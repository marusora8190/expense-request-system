<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>支出申請管理</title>
<style>
  :root{
    --ink:#e2604a;
    --ink-dark:#b8412c;
    --paper:#fffdf9;
    --line:#e4ded2;
    --text:#2b2622;
    --muted:#8a7f6e;
    --panel:#ffffff;
    --accent-bg:#fbf3ea;
    --green:#3f7d5c;
    --green-dark:#2f5f45;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f3efe6;
    color:var(--text);
  }
  .app{max-width:1400px;margin:0 auto;padding:28px 20px 80px;}
  .app-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .app-header h1{font-size:22px;margin:0;letter-spacing:.04em;}
  .app-header h1 span{color:var(--ink);}
  .app-header p{margin:4px 0 0;color:var(--muted);font-size:13px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .search-wrap{position:relative;flex:1;min-width:220px;max-width:360px;}
  .search-wrap input{
    width:100%;border:1px solid #d8d1c2;border-radius:7px;padding:9px 12px;
    font-size:14px;background:var(--panel);
  }
  select.year-filter{border:1px solid #d8d1c2;border-radius:7px;padding:9px 12px;font-size:14px;background:var(--panel);}
  .status-filter{display:flex;gap:6px;}
  .status-filter button{
    border:1px solid #d8d1c2;background:var(--panel);border-radius:20px;padding:7px 14px;
    font-size:13px;cursor:pointer;color:var(--text);
  }
  .status-filter button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .table-scroll{overflow-x:auto;background:var(--panel);border-radius:12px;border:1px solid var(--line);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{
    text-align:left;padding:11px 12px;background:var(--accent-bg);color:var(--ink-dark);
    font-weight:700;white-space:nowrap;border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:2;
  }
  td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fbf8f2;}
  td.subject-cell{white-space:normal;max-width:340px;font-weight:600;}
  td.amt{text-align:right;font-variant-numeric:tabular-nums;}
  .badge{
    display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
    margin-left:6px;font-weight:700;vertical-align:middle;
  }
  .badge-crossyear{background:#fdecea;color:var(--ink-dark);}
  .badge-done{background:#e9f5ee;color:var(--green-dark);}
  .badge-open{background:#fff6e0;color:#9a7300;}
  .row-edit-btn{
    background:var(--accent-bg);border:1px solid var(--line);border-radius:6px;
    padding:6px 12px;font-size:13px;cursor:pointer;color:var(--text);
  }
  .row-edit-btn:hover{background:#f1e6d6;}
  .empty-row td{text-align:center;color:var(--muted);padding:40px 0;}

  /* モーダル */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,25,20,.45);display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow-y:auto;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--panel);border-radius:14px;padding:26px 28px;max-width:640px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.2);
  }
  .modal-box h2{margin:0 0 4px;font-size:18px;}
  .modal-box .modal-sub{color:var(--muted);font-size:13px;margin:0 0 18px;}
  .summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .summary-box{background:var(--accent-bg);border-radius:10px;padding:12px 14px;}
  .summary-box .label{font-size:12px;color:var(--muted);margin-bottom:4px;}
  .summary-box .value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
  .summary-box.remaining .value{color:var(--ink-dark);}

  .payment-list{margin-bottom:16px;}
  .payment-row{
    display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);
  }
  .payment-row input[type="date"]{border:1px solid #d8d1c2;border-radius:6px;padding:7px 8px;font-size:13px;}
  .payment-row input[type="text"].amount-input{
    border:1px solid #d8d1c2;border-radius:6px;padding:7px 8px;font-size:13px;width:130px;text-align:right;
  }
  .payment-row input[type="text"].note-input{
    border:1px solid #d8d1c2;border-radius:6px;padding:7px 8px;font-size:13px;flex:1;min-width:80px;
  }
  .payment-row .del-btn{
    background:none;border:none;color:var(--ink-dark);cursor:pointer;font-size:16px;padding:4px 8px;
  }
  .add-payment-btn{
    background:var(--accent-bg);border:1px dashed var(--ink);color:var(--ink-dark);border-radius:8px;
    padding:9px 14px;font-size:13px;cursor:pointer;width:100%;margin-top:6px;
  }
  .add-payment-btn:hover{background:#f5e5d8;}

  .manual-complete-row{
    display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;color:var(--text);cursor:pointer;
  }
  .manual-complete-row input[type="checkbox"]{width:16px;height:16px;cursor:pointer;}

  .badge-manual{background:#e9f5ee;color:var(--green-dark);}

  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .btn-secondary{background:var(--accent-bg);border:1px solid var(--line);border-radius:7px;padding:10px 18px;font-size:14px;cursor:pointer;color:var(--text);}
  .btn-primary{background:var(--green);color:#fff;border:none;border-radius:7px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:700;}
  .btn-primary:hover{background:var(--green-dark);}
  .btn-primary:disabled{opacity:.5;cursor:default;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--text);color:#fff;padding:12px 20px;border-radius:8px;font-size:13.5px;
    box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1;}

  .loading{text-align:center;padding:40px;color:var(--muted);}

  /* タブ */
  .category-tab-nav{display:flex;gap:8px;margin-bottom:14px;}
  .category-tab-nav button{
    background:var(--panel);border:1px solid #d8d1c2;border-radius:9px;padding:11px 22px;
    font-size:15px;cursor:pointer;color:var(--text);font-weight:700;
  }
  .category-tab-nav button.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .tab-nav{display:flex;gap:6px;margin-bottom:18px;border-bottom:2px solid var(--line);}
  .tab-nav button{
    background:none;border:none;padding:10px 18px;font-size:14.5px;cursor:pointer;
    color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-2px;
  }
  .tab-nav button.active{color:var(--ink-dark);border-bottom-color:var(--ink);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* 印刷用タブ */
  .print-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .print-toolbar select{border:1px solid #d8d1c2;border-radius:7px;padding:9px 12px;font-size:14px;background:var(--panel);}
  .btn-print{background:var(--ink);color:#fff;border:none;border-radius:7px;padding:10px 20px;font-size:14px;cursor:pointer;font-weight:700;}
  .btn-print:hover{background:var(--ink-dark);}
  .print-sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px 30px;}
  .print-sheet h2{margin:0 0 4px;font-size:18px;text-align:center;}
  .print-sheet .print-date{text-align:right;color:var(--muted);font-size:12px;margin-bottom:14px;}
  .print-table{width:100%;border-collapse:collapse;font-size:13px;}
  .print-table th, .print-table td{border:1px solid #ccc2ac;padding:7px 9px;}
  .print-table th{background:var(--accent-bg);color:var(--ink-dark);}
  .print-table td.amt{text-align:right;font-variant-numeric:tabular-nums;}
  .print-table tfoot td{font-weight:700;background:#faf6ee;}

  /* 照合タブ */
  .verify-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .verify-toolbar select{border:1px solid #d8d1c2;border-radius:7px;padding:9px 12px;font-size:14px;background:var(--panel);}
  .verify-sheet{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px 26px;}
  .verify-hint{color:var(--muted);font-size:13px;margin:0 0 14px;}
  .verify-rows{margin-bottom:10px;}
  .verify-summary{margin-top:18px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:14px;}
  .verify-summary .row{display:flex;justify-content:space-between;max-width:360px;}
  .verify-summary .row span:last-child{font-weight:700;font-variant-numeric:tabular-nums;}
  .verify-breakdown{background:var(--accent-bg);border-radius:8px;padding:4px 14px;max-width:480px;}
  .verify-breakdown .b-row{
    display:flex;justify-content:space-between;gap:10px;padding:6px 0;
    border-bottom:1px solid #ecdfc9;font-size:13px;
  }
  .verify-breakdown .b-row:last-child{border-bottom:none;}
  .verify-breakdown .b-row .b-subject{color:var(--text);white-space:normal;}
  .verify-breakdown .b-row .b-amount{color:var(--ink-dark);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .verify-breakdown .b-empty{color:var(--muted);font-size:13px;padding:8px 0;}
  .verify-result{margin-top:8px;padding:12px 16px;border-radius:8px;font-weight:700;font-size:14px;}
  .verify-result.ok{background:#e9f5ee;color:var(--green-dark);}
  .verify-result.ng{background:#fdecea;color:var(--ink-dark);}

  @media (max-width:720px){
    .summary-grid{grid-template-columns:1fr;}
    table{font-size:12.5px;}
  }

  @media print{
    body{background:#fff;}
    .app-header, .category-tab-nav, .tab-nav, .print-toolbar, .modal-overlay, .toast{display:none !important;}
    #tab-list{display:none !important;}
    #tab-verify{display:none !important;}
    #tab-print{display:block !important;}
    .app{padding:0;max-width:none;}
    .print-sheet{border:none;padding:0;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div>
      <h1><span>支出</span>申請管理</h1>
      <p>予想経費申請書システムと連携し、工事ごとの支払い状況をまとめて管理します</p>
    </div>
  </div>

  <div class="category-tab-nav">
    <button type="button" class="active" data-category="本部" onclick="setCategoryFilter('本部')">本部営繕費</button>
    <button type="button" data-category="教庁" onclick="setCategoryFilter('教庁')">教庁営繕費</button>
  </div>

  <div class="tab-nav">
    <button type="button" class="active" data-tab="list" onclick="switchTab('list')">一覧</button>
    <button type="button" data-tab="print" onclick="switchTab('print')">印刷用</button>
    <button type="button" data-tab="verify" onclick="switchTab('verify')">照合</button>
  </div>

  <div class="tab-panel active" id="tab-list">
    <div class="toolbar">
      <div class="search-wrap">
        <input type="text" id="search-box" placeholder="主題・部署・担当で検索">
      </div>
      <select id="year-filter" class="year-filter">
        <option value="">すべての年度</option>
      </select>
      <div class="status-filter">
        <button type="button" class="active" data-status="all" onclick="setStatusFilter('all')">すべて</button>
        <button type="button" data-status="open" onclick="setStatusFilter('open')">支払い中</button>
        <button type="button" data-status="done" onclick="setStatusFilter('done')">完了</button>
      </div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>年度</th>
            <th>部署</th>
            <th>主題</th>
            <th>担当</th>
            <th style="text-align:right;">総経費</th>
            <th style="text-align:right;">支払合計</th>
            <th style="text-align:right;">残金</th>
            <th>状態</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="list-body">
          <tr class="empty-row"><td colspan="9" class="loading">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div class="tab-panel" id="tab-print">
    <div class="print-toolbar">
      <select id="print-year-filter" class="year-filter" onchange="renderPrintList()">
        <option value="">すべての年度</option>
      </select>
      <button type="button" class="btn-print" onclick="doPrint()">印刷する</button>
    </div>
    <div class="print-sheet">
      <h2 id="print-title">支出申請一覧</h2>
      <div class="print-date" id="print-date"></div>
      <table class="print-table">
        <thead>
          <tr>
            <th>年度</th>
            <th>部署</th>
            <th>主題</th>
            <th>担当</th>
            <th style="text-align:right;">総経費</th>
            <th style="text-align:right;">支払合計</th>
            <th style="text-align:right;">残金</th>
          </tr>
        </thead>
        <tbody id="print-body"></tbody>
        <tfoot>
          <tr>
            <td colspan="4">合計</td>
            <td class="amt" id="print-total-cost">¥0</td>
            <td class="amt" id="print-total-paid">¥0</td>
            <td class="amt" id="print-total-remaining">¥0</td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <div class="tab-panel" id="tab-verify">
    <div class="verify-toolbar">
      <select id="verify-year" class="year-filter" onchange="calcVerify()"></select>
      <select id="verify-month" class="year-filter" onchange="calcVerify()">
        <option value="4">4月</option>
        <option value="5">5月</option>
        <option value="6">6月</option>
        <option value="7">7月</option>
        <option value="8">8月</option>
        <option value="9">9月</option>
        <option value="10">10月</option>
        <option value="11">11月</option>
        <option value="12">12月</option>
        <option value="1">1月</option>
        <option value="2">2月</option>
        <option value="3">3月</option>
      </select>
    </div>
    <div class="verify-sheet">
      <p class="verify-hint">今月申請した工事名・金額を入力すると、システムに登録済みのその月の支払合計と自動で照合します。</p>
      <div class="verify-rows" id="verify-rows"></div>
      <button type="button" class="add-payment-btn" onclick="addVerifyRow()">＋ 行を追加</button>
      <div class="verify-summary">
        <div class="row"><span>入力した合計</span><span id="verify-input-total">¥0</span></div>
        <div class="row"><span>システム内の支払合計</span><span id="verify-system-total">¥0</span></div>
        <div class="verify-breakdown" id="verify-breakdown"></div>
        <div class="verify-result" id="verify-result">-</div>
      </div>
    </div>
  </div>
</div>

<!-- 編集モーダル -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-box">
    <h2 id="modal-title">-</h2>
    <p class="modal-sub" id="modal-sub">-</p>

    <div class="summary-grid">
      <div class="summary-box">
        <div class="label">総経費</div>
        <div class="value" id="summary-total">¥0</div>
      </div>
      <div class="summary-box">
        <div class="label">支払合計</div>
        <div class="value" id="summary-paid">¥0</div>
      </div>
      <div class="summary-box remaining">
        <div class="label">残金</div>
        <div class="value" id="summary-remaining">¥0</div>
      </div>
    </div>

    <div class="payment-list" id="payment-list"></div>
    <button type="button" class="add-payment-btn" onclick="addPaymentRow()">＋ 支払いを追加</button>

    <label class="manual-complete-row">
      <input type="checkbox" id="manual-complete-check" onchange="renderModalSummary()">
      支払いを完了として扱う(金額が一致していなくても)
    </label>

    <div class="modal-actions">
      <button type="button" class="btn-secondary" onclick="closeModal()">閉じる</button>
      <button type="button" class="btn-primary" id="save-btn" onclick="savePayments()">保存する</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://zhxuntrhxnrssqpvcmvl.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpoeHVudHJoeG5yc3NxcHZjbXZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyNDcyNjYsImV4cCI6MjA5NzgyMzI2Nn0.l3pwvKZVVJqDA4HORqt-Op-cTvVF3bkX1ovWgAuSO58";

async function sb(path, options = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...options,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      Prefer: options.prefer || 'return=representation',
      ...(options.headers || {})
    }
  });
  if (!res.ok) {
    const t = await res.text().catch(()=> '');
    throw new Error(`API error ${res.status}: ${t}`);
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

function fiscalYear(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const y = d.getFullYear();
  const m = d.getMonth()+1;
  return m >= 4 ? y : y - 1;
}
function eraLabel(fy){
  if(fy === null || fy === undefined) return '—';
  const r = fy - 2018;
  return r >= 1 ? `令和${r}年度` : `${fy}年度`;
}
function yen(n){
  return '¥' + Number(n||0).toLocaleString();
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let requests = [];   // expense_requests (with computed payment aggregates attached)
let payments = [];   // 全支払いレコード
let overrides = [];  // 手動「完了」フラグ
let statusFilter = 'all';
let categoryFilter = '本部'; // '本部' または '教庁'
let editingRequestId = null;
let editingRows = []; // モーダル内で編集中の支払い行
let verifyRows = [{subject:'', amount:''}]; // 照合タブで手入力中の行

async function loadAll(){
  const body = document.getElementById('list-body');
  body.innerHTML = '<tr class="empty-row"><td colspan="9" class="loading">読み込み中…</td></tr>';
  try{
    const [reqRows, payRows, ovrRows] = await Promise.all([
      sb('expense_requests?select=id,department,assignee_department,assignee,subject,budget_category,total_cost,budget_year,created_at'),
      sb('payments?select=*&order=payment_date.asc'),
      sb('payment_overrides?select=*')
    ]);
    requests = reqRows;
    payments = payRows;
    overrides = ovrRows;
    attachAggregates();
    populateYearFilter();
    renderList();
  }catch(e){
    body.innerHTML = '<tr class="empty-row"><td colspan="9">読み込みに失敗しました: '+escapeHtml(e.message)+'</td></tr>';
    console.error(e);
  }
}

function attachAggregates(){
  const byReq = {};
  payments.forEach(p=>{
    (byReq[p.expense_request_id] ||= []).push(p);
  });
  const overrideByReq = {};
  overrides.forEach(o=>{ overrideByReq[o.expense_request_id] = o.is_completed; });
  requests.forEach(r=>{
    const list = byReq[r.id] || [];
    r._payments = list;
    r._paidTotal = list.reduce((s,p)=>s+Number(p.amount||0),0);
    r._remaining = Number(r.total_cost||0) - r._paidTotal;
    r._fiscalYears = new Set(list.map(p=>fiscalYear(p.payment_date)));
    if(r.budget_year) r._fiscalYears.add(r.budget_year);
    r._crossYear = r._fiscalYears.size > 1;
    r._manualComplete = !!overrideByReq[r.id];
    r._done = r._manualComplete || (list.length > 0 && r._remaining <= 0);
  });
}

function matchesCategory(r){
  return (r.budget_category || '').startsWith(categoryFilter);
}

function populateYearFilter(){
  const years = new Set();
  requests.filter(matchesCategory).forEach(r=>{
    r._fiscalYears.forEach(y=>years.add(y));
  });
  const sorted = [...years].sort((a,b)=>b-a);
  const optionsHtml = '<option value="">すべての年度</option>' +
    sorted.map(y=>`<option value="${y}">${escapeHtml(eraLabel(y))}</option>`).join('');

  const sel = document.getElementById('year-filter');
  const prevListVal = sel.value;
  sel.innerHTML = optionsHtml;
  sel.value = prevListVal;

  const printSel = document.getElementById('print-year-filter');
  const prevPrintVal = printSel.value;
  printSel.innerHTML = optionsHtml;
  printSel.value = prevPrintVal;
}

// ---------------- 科目タブ切替(本部営繕費/教庁営繕費) ----------------
function setCategoryFilter(cat){
  categoryFilter = cat;
  document.querySelectorAll('.category-tab-nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.category === cat);
  });
  populateYearFilter();
  renderList();
  if(document.getElementById('tab-print').classList.contains('active')) renderPrintList();
  if(document.getElementById('tab-verify').classList.contains('active')){
    populateVerifyYearOptions();
    calcVerify();
  }
}

// ---------------- タブ切替 ----------------
function switchTab(tab){
  document.querySelectorAll('.tab-nav button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.getElementById('tab-list').classList.toggle('active', tab === 'list');
  document.getElementById('tab-print').classList.toggle('active', tab === 'print');
  document.getElementById('tab-verify').classList.toggle('active', tab === 'verify');
  if(tab === 'print') renderPrintList();
  if(tab === 'verify'){
    populateVerifyYearOptions();
    renderVerifyRows();
    calcVerify();
  }
}

// ---------------- 照合タブ ----------------
function populateVerifyYearOptions(){
  const years = new Set();
  requests.filter(matchesCategory).forEach(r=>{
    r._fiscalYears.forEach(y=>years.add(y));
  });
  const sorted = [...years].sort((a,b)=>b-a);
  const sel = document.getElementById('verify-year');
  const prevVal = sel.value;
  sel.innerHTML = sorted.map(y=>`<option value="${y}">${escapeHtml(eraLabel(y))}</option>`).join('');
  if(sorted.some(y=>String(y)===prevVal)) sel.value = prevVal;
}

function renderVerifyRows(){
  const wrap = document.getElementById('verify-rows');
  wrap.innerHTML = verifyRows.map((row, idx)=>`
    <div class="payment-row" data-idx="${idx}">
      <input type="text" class="note-input" placeholder="工事名(任意)" value="${escapeHtml(row.subject)}" oninput="updateVerifyRow(${idx},'subject',this.value)">
      <input type="text" class="amount-input" placeholder="金額" value="${row.amount}" oninput="updateVerifyRow(${idx},'amount',this.value.replace(/[^0-9]/g,''))">
      <button type="button" class="del-btn" title="削除" onclick="deleteVerifyRow(${idx})">×</button>
    </div>
  `).join('');
}

function updateVerifyRow(idx, key, value){
  verifyRows[idx][key] = value;
  calcVerify();
}
function addVerifyRow(){
  verifyRows.push({subject:'', amount:''});
  renderVerifyRows();
  calcVerify();
}
function deleteVerifyRow(idx){
  verifyRows.splice(idx,1);
  if(verifyRows.length === 0) verifyRows.push({subject:'', amount:''});
  renderVerifyRows();
  calcVerify();
}

function calcSystemMonthlyTotal(fy, month){
  if(!fy || !month) return 0;
  const calYear = month >= 4 ? fy : fy + 1;
  let total = 0;
  requests.filter(matchesCategory).forEach(r=>{
    (r._payments || []).forEach(p=>{
      if(!p.payment_date) return;
      const d = new Date(p.payment_date + 'T00:00:00');
      if(d.getFullYear() === calYear && (d.getMonth()+1) === month){
        total += Number(p.amount || 0);
      }
    });
  });
  return total;
}

function calcSystemMonthlyDetails(fy, month){
  if(!fy || !month) return [];
  const calYear = month >= 4 ? fy : fy + 1;
  const rows = [];
  requests.filter(matchesCategory).forEach(r=>{
    (r._payments || []).forEach(p=>{
      if(!p.payment_date) return;
      const d = new Date(p.payment_date + 'T00:00:00');
      if(d.getFullYear() === calYear && (d.getMonth()+1) === month){
        rows.push({ subject: r.subject || '（主題未入力）', amount: Number(p.amount || 0) });
      }
    });
  });
  rows.sort((a,b)=> b.amount - a.amount);
  return rows;
}

function calcVerify(){
  const fy = Number(document.getElementById('verify-year').value);
  const month = Number(document.getElementById('verify-month').value);
  const inputTotal = verifyRows.reduce((s,r)=>s + (Number(r.amount) || 0), 0);
  const systemTotal = calcSystemMonthlyTotal(fy, month);
  const details = calcSystemMonthlyDetails(fy, month);

  document.getElementById('verify-input-total').textContent = yen(inputTotal);
  document.getElementById('verify-system-total').textContent = yen(systemTotal);

  const breakdownEl = document.getElementById('verify-breakdown');
  if(details.length === 0){
    breakdownEl.innerHTML = '<div class="b-empty">該当する支払い記録がありません</div>';
  }else{
    breakdownEl.innerHTML = details.map(d=>`
      <div class="b-row">
        <span class="b-subject">${escapeHtml(d.subject)}</span>
        <span class="b-amount">${yen(d.amount)}</span>
      </div>
    `).join('');
  }

  const resultEl = document.getElementById('verify-result');
  if(!fy){
    resultEl.textContent = '年度を選択してください';
    resultEl.className = 'verify-result';
    return;
  }
  if(inputTotal === systemTotal){
    resultEl.textContent = 'OK！　金額が一致しています';
    resultEl.className = 'verify-result ok';
  }else{
    const diff = inputTotal - systemTotal;
    const sign = diff > 0 ? '+' : '';
    resultEl.textContent = `※金額が合っていません！確認して下さい！！！（差額 ${sign}${yen(diff)}）`;
    resultEl.className = 'verify-result ng';
  }
}

// ---------------- 印刷用タブ ----------------
function renderPrintList(){
  const yearSel = document.getElementById('print-year-filter').value;
  const catLabel = categoryFilter === '本部' ? '本部営繕費' : '教庁営繕費';
  let rows = requests.filter(matchesCategory);
  if(yearSel){
    const y = Number(yearSel);
    rows = rows.filter(r => r._fiscalYears.has(y));
    document.getElementById('print-title').textContent = `${catLabel}　支出申請一覧（${eraLabel(y)}）`;
  }else{
    document.getElementById('print-title').textContent = `${catLabel}　支出申請一覧（全年度）`;
  }
  rows.sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));

  const body = document.getElementById('print-body');
  if(rows.length === 0){
    body.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--muted);">該当する工事がありません</td></tr>';
  }else{
    body.innerHTML = rows.map(r=>`
      <tr>
        <td>${escapeHtml(eraLabel(r.budget_year))}</td>
        <td>${escapeHtml(r.department||'—')}</td>
        <td>${escapeHtml(r.subject||'（主題未入力）')}</td>
        <td>${escapeHtml(r.assignee||'—')}</td>
        <td class="amt">${yen(r.total_cost)}</td>
        <td class="amt">${yen(r._paidTotal)}</td>
        <td class="amt">${yen(r._remaining)}</td>
      </tr>`).join('');
  }

  const totalCost = rows.reduce((s,r)=>s+Number(r.total_cost||0),0);
  const totalPaid = rows.reduce((s,r)=>s+Number(r._paidTotal||0),0);
  document.getElementById('print-total-cost').textContent = yen(totalCost);
  document.getElementById('print-total-paid').textContent = yen(totalPaid);
  document.getElementById('print-total-remaining').textContent = yen(totalCost - totalPaid);

  document.getElementById('print-date').textContent =
    '出力日：' + new Date().toLocaleDateString('ja-JP');
}

function doPrint(){
  renderPrintList();
  window.print();
}

function setStatusFilter(s){
  statusFilter = s;
  document.querySelectorAll('.status-filter button').forEach(b=>{
    b.classList.toggle('active', b.dataset.status === s);
  });
  renderList();
}

function getFilteredRequests(){
  const kw = document.getElementById('search-box').value.trim();
  const yearSel = document.getElementById('year-filter').value;
  let rows = requests.filter(matchesCategory);

  if(yearSel){
    const y = Number(yearSel);
    rows = rows.filter(r => r._fiscalYears.has(y));
  }
  if(kw){
    const keywords = kw.split(/[\s　]+/).filter(Boolean);
    rows = rows.filter(r=>{
      const hay = [r.subject, r.department, r.assignee_department, r.assignee].join(' ');
      return keywords.every(k => hay.includes(k));
    });
  }
  if(statusFilter === 'open'){
    rows = rows.filter(r => !r._done);
  }else if(statusFilter === 'done'){
    rows = rows.filter(r => r._done);
  }

  rows.sort((a,b)=> (b.created_at||'').localeCompare(a.created_at||''));
  return rows;
}

function renderList(){
  const body = document.getElementById('list-body');
  const rows = getFilteredRequests();
  if(rows.length === 0){
    body.innerHTML = '<tr class="empty-row"><td colspan="9">該当する工事がありません</td></tr>';
    return;
  }
  body.innerHTML = rows.map(r=>{
    const badges = [];
    if(r._crossYear) badges.push('<span class="badge badge-crossyear">年度またぎ</span>');
    if(r._done) badges.push('<span class="badge badge-done">完了</span>');
    else if(r._paidTotal > 0) badges.push('<span class="badge badge-open">支払い中</span>');
    else badges.push('<span class="badge badge-open">未払い</span>');
    if(r._manualComplete && r._remaining !== 0) badges.push('<span class="badge badge-manual">手動完了</span>');

    return `
      <tr>
        <td>${escapeHtml(eraLabel(r.budget_year))}</td>
        <td>${escapeHtml(r.department||'—')}</td>
        <td class="subject-cell">${escapeHtml(r.subject||'（主題未入力）')}</td>
        <td>${escapeHtml(r.assignee||'—')}</td>
        <td class="amt">${yen(r.total_cost)}</td>
        <td class="amt">${yen(r._paidTotal)}</td>
        <td class="amt">${yen(r._remaining)}</td>
        <td>${badges.join(' ')}</td>
        <td><button type="button" class="row-edit-btn" onclick="openModal('${r.id}')">支払いを記録</button></td>
      </tr>`;
  }).join('');
}

document.getElementById('search-box').addEventListener('input', renderList);
document.getElementById('year-filter').addEventListener('change', renderList);

// ---------------- モーダル ----------------
function openModal(id){
  const r = requests.find(x=>x.id === id);
  if(!r) return;
  editingRequestId = id;
  editingRows = (r._payments || []).map(p=>({
    id: p.id, payment_date: p.payment_date, amount: p.amount, note: p.note || '', _deleted:false
  }));

  document.getElementById('modal-title').textContent = r.subject || '（主題未入力）';
  document.getElementById('modal-sub').textContent =
    `${eraLabel(r.budget_year)}　${r.department||''}　担当:${r.assignee||'—'}`;
  document.getElementById('manual-complete-check').checked = !!r._manualComplete;

  renderModalSummary();
  renderPaymentRows();
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(){
  document.getElementById('modal-overlay').classList.remove('open');
  editingRequestId = null;
  editingRows = [];
}

function currentReq(){
  return requests.find(x=>x.id === editingRequestId);
}

function renderModalSummary(){
  const r = currentReq();
  const paidTotal = editingRows.filter(x=>!x._deleted).reduce((s,x)=>s+(Number(x.amount)||0),0);
  const remaining = Number(r.total_cost||0) - paidTotal;
  document.getElementById('summary-total').textContent = yen(r.total_cost);
  document.getElementById('summary-paid').textContent = yen(paidTotal);
  document.getElementById('summary-remaining').textContent = yen(remaining);
}

function renderPaymentRows(){
  const wrap = document.getElementById('payment-list');
  const visible = editingRows.map((row, idx)=>({row, idx})).filter(x=>!x.row._deleted);
  if(visible.length === 0){
    wrap.innerHTML = '<div style="color:var(--muted);font-size:13px;padding:10px 0;">まだ支払い記録がありません</div>';
    return;
  }
  wrap.innerHTML = visible.map(({row, idx})=>`
    <div class="payment-row" data-idx="${idx}">
      <input type="date" value="${row.payment_date||''}" onchange="updateRow(${idx},'payment_date',this.value)">
      <input type="text" class="amount-input" placeholder="金額" value="${row.amount||''}" oninput="updateRow(${idx},'amount',this.value.replace(/[^0-9]/g,''))">
      <input type="text" class="note-input" placeholder="備考(任意)" value="${escapeHtml(row.note||'')}" oninput="updateRow(${idx},'note',this.value)">
      <button type="button" class="del-btn" title="削除" onclick="deleteRow(${idx})">×</button>
    </div>
  `).join('');
}

function updateRow(idx, key, value){
  editingRows[idx][key] = value;
  renderModalSummary();
}
function deleteRow(idx){
  if(editingRows[idx].id){
    editingRows[idx]._deleted = true;
  }else{
    editingRows.splice(idx,1);
  }
  renderPaymentRows();
  renderModalSummary();
}
function addPaymentRow(){
  editingRows.push({id:null, payment_date:new Date().toISOString().slice(0,10), amount:'', note:'', _deleted:false});
  renderPaymentRows();
  renderModalSummary();
}

async function savePayments(){
  const btn = document.getElementById('save-btn');
  const prevLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '保存中…';
  try{
    // 削除
    const toDelete = editingRows.filter(r=>r._deleted && r.id);
    for(const r of toDelete){
      await sb(`payments?id=eq.${r.id}`, { method:'DELETE', prefer:'return=minimal' });
    }
    // 新規追加・更新
    const toKeep = editingRows.filter(r=>!r._deleted);
    for(const r of toKeep){
      if(!r.payment_date || !r.amount) continue; // 未入力の空行はスキップ
      const payload = {
        expense_request_id: editingRequestId,
        payment_date: r.payment_date,
        amount: Number(r.amount),
        note: r.note || null
      };
      if(r.id){
        await sb(`payments?id=eq.${r.id}`, {
          method:'PATCH', prefer:'return=minimal',
          body: JSON.stringify({...payload, updated_at: new Date().toISOString()})
        });
      }else{
        await sb('payments', { method:'POST', prefer:'return=minimal', body: JSON.stringify(payload) });
      }
    }

    // 手動「完了」フラグの保存(upsert)
    const manualComplete = document.getElementById('manual-complete-check').checked;
    await sb('payment_overrides', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: JSON.stringify({
        expense_request_id: editingRequestId,
        is_completed: manualComplete,
        updated_at: new Date().toISOString()
      })
    });

    showToast('保存しました');
    closeModal();
    await loadAll();
  }catch(e){
    showToast('保存に失敗しました: ' + e.message, 6000);
    console.error(e);
  }finally{
    btn.disabled = false;
    btn.textContent = prevLabel;
  }
}

let toastTimer = null;
function showToast(msg, ms=3000){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), ms);
}

document.getElementById('modal-overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'modal-overlay') closeModal();
});

loadAll();
</script>
