<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>予想経費申請書</title>
<style>
  :root{
    --ink:#e2604a;
    --ink-dark:#b8412c;
    --paper:#fffdf9;
    --line:#e4ded2;
    --text:#2b2622;
    --muted:#8a7f6e;
    --panel:#ffffff;
    --accent-bg:#fbf3ea;
  }
  *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact;color-adjust:exact;}
  body{
    margin:0;
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    background:#f3efe6;
    color:var(--text);
  }
  .app{max-width:1100px;margin:0 auto;padding:28px 20px 80px;}
  .app-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:8px;}
  .app-header h1{font-size:22px;margin:0;letter-spacing:.04em;}
  .app-header h1 span{color:var(--ink);}
  .app-header p{margin:4px 0 0;color:var(--muted);font-size:12.5px;}

  .tabs{display:flex;gap:6px;margin-bottom:20px;}
  .tab{
    padding:9px 18px;border:1px solid var(--line);background:var(--panel);
    border-radius:8px;cursor:pointer;font-size:14px;color:var(--muted);
  }
  .tab.active{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;}

  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field.full{grid-column:1 / -1;}
  .field label{font-size:12.5px;color:var(--muted);font-weight:600;}
  .field input, .field select, .field textarea{
    border:1px solid #d8d1c2;border-radius:7px;padding:9px 10px;font-size:14px;
    font-family:inherit;background:#fffefb;color:var(--text);
  }
  .field input:focus, .field select:focus, .field textarea:focus{
    outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(165,42,32,.1);
  }
  .field textarea{resize:vertical;min-height:64px;}
  .form-title{font-size:15px;font-weight:700;margin-bottom:16px;color:var(--ink);}
  .list-toolbar{margin-bottom:14px;}
  .list-toolbar input{
    width:100%;max-width:320px;border:1px solid #d8d1c2;border-radius:7px;padding:9px 12px;
    font-size:13.5px;font-family:inherit;background:#fffefb;color:var(--text);
  }
  .list-toolbar input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(165,42,32,.1);}
  .icon-btn.edit:hover{background:#e8e1d2;}
  .checkbox-row{display:flex;align-items:center;gap:8px;grid-column:1/-1;}
  .checkbox-row input{width:16px;height:16px;}
  .checkbox-row label{font-size:13px;color:var(--text);font-weight:500;}

  .actions-row{margin-top:22px;display:flex;justify-content:flex-end;gap:10px;}
  button{font-family:inherit;cursor:pointer;border:none;}
  .btn-primary{
    background:var(--ink);color:#fff;padding:11px 26px;border-radius:8px;font-size:14.5px;font-weight:600;
  }
  .btn-primary:hover{background:var(--ink-dark);}
  .btn-secondary{background:#f1ece1;color:var(--text);padding:11px 20px;border-radius:8px;font-size:14px;}
  .btn-secondary:hover{background:#e8e1d2;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:2px solid var(--line);}
  td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:hover td{background:var(--accent-bg);}
  .subject-cell{max-width:280px;}
  .amt{font-variant-numeric:tabular-nums;font-weight:600;}
  .row-actions{display:flex;gap:6px;white-space:nowrap;}
  .icon-btn{background:#f1ece1;padding:6px 12px;border-radius:6px;font-size:12.5px;color:var(--text);}
  .icon-btn.print{background:var(--ink);color:#fff;}
  .icon-btn.print:hover{background:var(--ink-dark);}
  .icon-btn.del:hover{background:#f4d9d5;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:13.5px;}
  .loading{color:var(--muted);text-align:center;padding:40px 0;font-size:13.5px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink-dark);color:#fff;padding:11px 22px;border-radius:8px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ===== Print form overlay ===== */
  #print-overlay{
    display:none;position:fixed;inset:0;background:rgba(30,25,20,.55);z-index:50;
    align-items:center;justify-content:center;overflow:auto;padding:30px 16px;
  }
  #print-overlay.show{display:flex;}
  .print-toolbar{
    max-width:1050px;margin:0 auto 14px;display:flex;justify-content:flex-end;gap:10px;
  }
  .print-toolbar button{padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600;}
  .print-toolbar .go{background:var(--ink);color:#fff;}
  .print-toolbar .close{background:#fff;color:var(--text);}

  .sheet{
    width:242mm;background:#fff;margin:0 auto;padding:22px;
    font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;color:var(--ink);
    border:1px solid #ddd;box-sizing:border-box;
  }
  .sheet-inner{border:1.5px solid var(--ink);width:220mm;}
  .user-input{font-family:"Meiryo UI","Meiryo",sans-serif;color:#000;font-weight:400;}
  .num{font-family:"Meiryo UI","Meiryo",sans-serif;color:#000;font-weight:400;}
  .row{display:flex;border-bottom:1.5px solid var(--ink);}
  .row:last-child{border-bottom:none;}
  .cell{border-right:1.5px solid var(--ink);padding:7px 10px;position:relative;}
  .cell:last-child{border-right:none;}
  .label-col{
    writing-mode:vertical-rl;text-align:center;font-weight:700;font-size:14px;
    letter-spacing:.15em;flex:0 0 34px;display:flex;align-items:center;justify-content:center;
    border-right:1.5px solid var(--ink);
  }
  .plan-row .label-col, .subject-row .label-col{
    flex:0 0 10mm;box-sizing:border-box;
    border-right:2px double var(--ink);
  }

  /* stamp box */
  .stampbox-wrap{display:flex;justify-content:flex-end;padding:0 20% 2px 0;}
  .stampbox{border:1.5px solid var(--ink);display:flex;}
  .stampbox .sc{width:13mm;border-right:1.5px solid var(--ink);text-align:center;box-sizing:border-box;}
  .stampbox .sc:last-child{border-right:none;}
  .stampbox .sc .h{font-size:11px;font-weight:700;border-bottom:1.5px solid var(--ink);height:20px;line-height:20px;box-sizing:border-box;font-family:"HG正楷書体-PRO","HGSeikaishotaiPRO","Hiragino Mincho ProN",serif;}
  .stampbox .sc .b{height:14mm;box-sizing:border-box;}

  .title-row{display:flex;align-items:baseline;gap:2px;padding:6px 4px 1px;margin:0 auto 0;width:170mm;border-bottom:1.5px solid var(--ink);white-space:nowrap;}
  .title-row h2{font-size:23px;letter-spacing:normal;word-spacing:.32em;margin:0;font-weight:700;font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;white-space:nowrap;}
  .title-row .meta{font-size:9px;display:flex;align-items:flex-end;gap:8px;line-height:1.25;white-space:nowrap;}
  .title-row .meta .lbl{writing-mode:horizontal-tb;text-align:center;}
  .title-row .meta .lbl-v{writing-mode:vertical-rl;text-align:center;letter-spacing:.05em;}
  .title-row .meta .bracket{font-size:14px;}
  .bracket{font-weight:700;}

  .submit-date{text-align:right;font-size:13px;padding:6px 0 0;white-space:nowrap;width:220mm;margin:0;box-sizing:border-box;font-family:"MS Mincho","MS 明朝","Hiragino Mincho ProN",serif;}
  .rl{letter-spacing:.1em;font-family:"MS Mincho","MS 明朝","Hiragino Mincho ProN",serif;}
  .num{letter-spacing:0;padding:0 2px;font-variant-numeric:tabular-nums;}
  .suffix{letter-spacing:0;font-family:"MS Mincho","MS 明朝","Hiragino Mincho ProN",serif;}

  .plan-row .cell{flex:1;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
  .plan-row .cell:first-of-type{border-right:2px double var(--ink);}

  .subject-row .subject-val{flex:0 0 130mm;width:130mm;box-sizing:border-box;font-size:15px;font-weight:400;display:flex;align-items:center;padding-left:14px;border-right:2px double var(--ink);}
  .subject-row .budget-label{flex:0 0 32px;writing-mode:vertical-rl;text-align:center;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.1em;border-right:2px double var(--ink);}
  .subject-row .budget-val{flex:1;display:flex;align-items:center;justify-content:center;font-size:14.5px;font-weight:400;}

  .cost-row{align-items:stretch;height:13.5mm;box-sizing:border-box;overflow:hidden;}
  .plan-row{height:10.5mm;box-sizing:border-box;}
  .subject-row{height:16mm;box-sizing:border-box;}
  .cost-row .label-col{
    flex:0 0 auto;width:40mm;font-size:13px;box-sizing:border-box;
    writing-mode:horizontal-tb;letter-spacing:.4em;padding:0 6px;white-space:nowrap;
    border-right:2px double var(--ink);
  }
  .digit-wrap{display:flex;flex-direction:column;justify-content:center;flex:0 0 100mm;width:100mm;box-sizing:border-box;border-right:2px double var(--ink);}
  .digit-heads{display:flex;height:13px;}
  .digit-heads div{
    width:10mm;text-align:right;padding-right:3px;box-sizing:border-box;font-size:9px;line-height:13px;
    background-image:repeating-linear-gradient(to bottom, var(--ink) 0 1.5px, transparent 1.5px 5.5px);
    background-size:1px 100%;background-position:right top;background-repeat:no-repeat;
  }
  .digit-heads div:last-child{background-image:none;}
  .digit-cells{display:flex;}
  .digit-cells div{
    width:10mm;height:37px;text-align:center;font-size:19px;font-weight:400;line-height:37px;font-variant-numeric:tabular-nums;box-sizing:border-box;
    background-image:repeating-linear-gradient(to bottom, var(--ink) 0 1.5px, transparent 1.5px 5.5px);
    background-size:1px 100%;background-position:right top;background-repeat:no-repeat;
  }
  .digit-cells div:last-child{background-image:none;}
  .cost-note{flex:1;display:flex;align-items:center;justify-content:center;font-size:13px;padding-left:12px;letter-spacing:.15em;}

  .text-block-row .label-col{flex:0 0 34px;}
  .text-block{flex:1;padding:2px 14px 4px 28px;font-size:13.5px;line-height:2;white-space:pre-wrap;box-sizing:border-box;display:flex;align-items:flex-start;}
  .text-block-row .text-block{
    background-image:
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px),
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px),
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px);
    background-size:100% 1px;
    background-repeat:no-repeat;
    background-position:0 25%, 0 50%, 0 75%;
  }
  .text-block-row{height:33mm;box-sizing:border-box;}
  .remarks-row{height:49mm;box-sizing:border-box;}
  .remarks-row .text-block{
    background-image:
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px),
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px),
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px),
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px),
      repeating-linear-gradient(to right, var(--ink) 0 1.5px, transparent 1.5px 5.5px);
    background-size:100% 1px;
    background-repeat:no-repeat;
    background-position:0 16.6667%, 0 33.3333%, 0 50%, 0 66.6667%, 0 83.3333%;
  }
  .remarks-row .label-col{flex:0 0 34px;}
  .remarks-row .label-col .rl-main{display:block;}
  .remarks-row .label-col .rl-sub{display:block;margin-top:8px;}
  .remarks-row .label-col .rl-main{font-size:16px;font-weight:700;}
  .remarks-row .label-col .rl-sub{font-size:9px;font-weight:500;letter-spacing:.05em;line-height:1.2;}
  .sheet-footer{text-align:right;font-size:11px;color:var(--ink);padding:6px 4px 0;letter-spacing:.05em;}


  @media print{
    *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}
    html, body{height:auto !important;margin:0 !important;padding:0 !important;overflow:visible !important;}
    .app{display:none !important;}
    .toast{display:none !important;}
    #print-overlay{
      display:flex !important;position:static !important;inset:auto;
      background:#fff;padding:0 !important;
      align-items:center;justify-content:center;
      width:100%;height:auto;min-height:0;
      overflow:visible !important;
    }
    .print-toolbar{display:none;}
    .sheet{
      border:none !important;width:245mm !important;margin:0 !important;padding:0 !important;
      transform:scale(.99) !important;transform-origin:center center !important;
      zoom:1 !important;
    }
    @page{size:B5 landscape;margin:3mm;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="app-header">
    <div>
      <h1><span>予想経費</span>申請書システム</h1>
      <p>入力した内容を原紙レイアウトのまま印刷できます</p>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="new" onclick="switchTab('new')">新規申請</button>
    <button class="tab" data-tab="list" onclick="switchTab('list')">申請一覧・印刷</button>
  </div>

  <!-- NEW REQUEST -->
  <div class="panel" id="tab-new">
    <div class="form-title" id="form-mode-title">新規申請</div>
    <div class="field-grid">
      <div class="field">
        <label>科目</label>
        <select id="f-category">
          <option value="">選択してください</option>
          <option value="本部">本部</option>
          <option value="教庁">教庁</option>
        </select>
      </div>
      <div class="field">
        <label>提出部署</label>
        <select id="f-department"><option value="">読み込み中…</option></select>
      </div>

      <div class="field">
        <label>担当</label>
        <input type="text" id="f-assignee" list="assignee-list" placeholder="例）穀本・電気">
        <datalist id="assignee-list"></datalist>
      </div>
      <div class="field">
        <label>PDF No.</label>
        <input type="text" id="f-pdf-no" placeholder="例）2026026">
      </div>

      <div class="field">
        <label>提出年月日</label>
        <input type="date" id="f-submit-date">
      </div>
      <div class="field"></div>

      <div class="field">
        <label>着工予定日</label>
        <input type="date" id="f-start-date">
      </div>
      <div class="field">
        <label>終了予定日</label>
        <input type="date" id="f-end-date">
      </div>

      <div class="field full">
        <label>主題</label>
        <input type="text" id="f-subject" placeholder="例）殿内(3号・4号・6号・7号便所)ウォシュレット電源工事">
      </div>

      <div class="field">
        <label>予算科目</label>
        <input type="text" id="f-budget" placeholder="例）本部営繕費">
      </div>
      <div class="field">
        <label>予想の総経費（円）</label>
        <input type="number" id="f-cost" min="0" step="1" placeholder="例）7678000">
      </div>

      <div class="checkbox-row">
        <input type="checkbox" id="f-estimate">
        <label for="f-estimate">見積書・明細書は別紙添付する</label>
      </div>

      <div class="field full">
        <label>実施の概要</label>
        <textarea id="f-overview" placeholder="工事・購入等の内容を記入"></textarea>
      </div>
      <div class="field full">
        <label>予備（変更等使用時に・原紙印刷欄）</label>
        <textarea id="f-remarks" placeholder="変更等があった場合の記録欄"></textarea>
      </div>

      <div class="field">
        <label>会計提出日</label>
        <input type="date" id="f-acc-submit">
      </div>
      <div class="field">
        <label>会計承認日</label>
        <input type="date" id="f-acc-approve">
      </div>

      <div class="field full">
        <label>備考（一覧用メモ・印刷には出ません）</label>
        <input type="text" id="f-list-note" placeholder="例）水道課予算">
      </div>
    </div>

    <div class="actions-row">
      <button class="btn-secondary" onclick="resetForm()">クリア</button>
      <button class="btn-primary" id="save-btn" onclick="saveRequest()">保存する</button>
    </div>
  </div>

  <!-- LIST -->
  <div class="panel" id="tab-list" style="display:none;">
    <div class="list-toolbar">
      <input type="text" id="search-box" placeholder="主題・担当で検索" oninput="renderList()">
    </div>
    <table>
      <thead>
        <tr>
          <th>提出日</th>
          <th>科目</th>
          <th>主題</th>
          <th>金額</th>
          <th>担当</th>
          <th>会計提出</th>
          <th>会計承認</th>
          <th>PDF No.</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="list-body">
        <tr><td colspan="9" class="loading">読み込み中…</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- PRINT OVERLAY -->
<div id="print-overlay">
  <div>
    <div class="print-toolbar">
      <button class="close" onclick="closePrint()">閉じる</button>
      <button class="go" onclick="window.print()">この内容で印刷</button>
    </div>
    <div class="sheet">
      <div class="stampbox-wrap">
        <div class="stampbox">
          <div class="sc"><div class="h">部長</div><div class="b"></div></div>
          <div class="sc"><div class="h">次長</div><div class="b"></div></div>
          <div class="sc"><div class="h">課長</div><div class="b"></div></div>
          <div class="sc"><div class="h"></div><div class="b"></div></div>
          <div class="sc"><div class="h"></div><div class="b"></div></div>
        </div>
      </div>

      <div class="title-row">
        <h2>予 想 経 費 申 請 書</h2>
        <span class="fw-gap">　</span>
        <div class="meta">
          <span class="lbl">提出<br>部署</span> <span class="bracket" id="p-department">（　　　　　　　　　　　　　　）</span>
          <span class="lbl-v">部長印</span> <span class="bracket">（　　　　）</span>
        </div>
      </div>
      <div class="submit-date" id="p-submit-date">令和 年 月 日提出</div>

      <div class="sheet-inner" style="margin-top:8px;">
        <div class="row plan-row">
          <div class="label-col">予定</div>
          <div class="cell" style="flex:2;">
            <span id="p-start-date">令和　　　年　　　　月　　　　日　　着 工 予 定</span>
          </div>
          <div class="cell" style="flex:2;">
            <span id="p-end-date">令和　　　年　　　　月　　　　日　　終 了 予 定</span>
          </div>
        </div>

        <div class="row subject-row">
          <div class="label-col">主題</div>
          <div class="subject-val user-input" id="p-subject">&nbsp;</div>
          <div class="budget-label">予算科目</div>
          <div class="budget-val user-input" id="p-budget">&nbsp;</div>
        </div>

        <div class="row cost-row">
          <div class="label-col">予想の総経費</div>
          <div class="digit-wrap">
            <div class="digit-heads">
              <div></div><div>億</div><div>千</div><div>百</div><div>十</div><div>万</div><div>千</div><div>百</div><div>十</div><div>円</div>
            </div>
            <div class="digit-cells user-input" id="p-cost-cells"></div>
          </div>
          <div class="cost-note">見積書　明細書は　別紙添付</div>
        </div>

        <div class="row text-block-row">
          <div class="label-col">実施の概要</div>
          <div class="text-block user-input" id="p-overview"></div>
        </div>

        <div class="row text-block-row remarks-row">
          <div class="label-col">
            <span class="rl-main">予備</span>
            <span class="rl-sub">（時に使用変更等の）</span>
          </div>
          <div class="text-block user-input" id="p-remarks"></div>
        </div>
      </div>
      <div class="sheet-footer">182.　10　(50×10)</div>
    </div>
  </div>
</div>

async function sb(path, opts={}){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers:{
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type":"application/json",
      ...(opts.headers||{})
    }
  });
  if(!res.ok){
    const t = await res.text().catch(()=> "");
    throw new Error(`Supabase error ${res.status}: ${t}`);
  }
  if(res.status===204) return null;
  return res.json();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function switchTab(name){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.dataset.tab===name));
  document.getElementById('tab-new').style.display = name==='new' ? 'block':'none';
  document.getElementById('tab-list').style.display = name==='list' ? 'block':'none';
  if(name==='list') loadList();
}

let editingId = null;

function resetForm(){
  ['f-submit-date','f-start-date','f-end-date','f-subject','f-budget','f-cost','f-overview','f-remarks',
   'f-category','f-assignee','f-acc-submit','f-acc-approve','f-pdf-no','f-list-note'].forEach(id=>{
    document.getElementById(id).value = '';
  });
  document.getElementById('f-department').value = '';
  document.getElementById('f-estimate').checked = false;
  document.getElementById('f-submit-date').value = new Date().toISOString().slice(0,10);
  editingId = null;
  document.getElementById('form-mode-title').textContent = '新規申請';
  document.getElementById('save-btn').textContent = '保存する';
}

async function loadOptions(){
  try{
    const [deps, assignees] = await Promise.all([
      sb('departments?select=name&order=sort_order.asc'),
      sb('expense_requests?select=assignee&assignee=not.is.null')
    ]);
    const dSel = document.getElementById('f-department');
    dSel.innerHTML = '<option value="">選択してください</option>' + deps.map(d=>`<option value="${d.name}">${d.name}</option>`).join('');

    const uniqueAssignees = [...new Set(assignees.map(a=>a.assignee).filter(Boolean))].sort();
    document.getElementById('assignee-list').innerHTML = uniqueAssignees.map(a=>`<option value="${a}"></option>`).join('');
  }catch(e){
    showToast('選択肢の読み込みに失敗しました');
    console.error(e);
  }
}

async function saveRequest(){
  const subject = document.getElementById('f-subject').value.trim();
  if(!subject){ showToast('主題を入力してください'); return; }

  const payload = {
    category: document.getElementById('f-category').value || null,
    department: document.getElementById('f-department').value || null,
    assignee: document.getElementById('f-assignee').value || null,
    pdf_no: document.getElementById('f-pdf-no').value || null,
    submit_date: document.getElementById('f-submit-date').value || null,
    start_date: document.getElementById('f-start-date').value || null,
    end_date: document.getElementById('f-end-date').value || null,
    subject,
    budget_category: document.getElementById('f-budget').value || null,
    total_cost: document.getElementById('f-cost').value ? Number(document.getElementById('f-cost').value) : null,
    has_estimate_attached: document.getElementById('f-estimate').checked,
    overview: document.getElementById('f-overview').value || null,
    remarks: document.getElementById('f-remarks').value || null,
    accounting_submit_date: document.getElementById('f-acc-submit').value || null,
    accounting_approve_date: document.getElementById('f-acc-approve').value || null,
    list_note: document.getElementById('f-list-note').value || null
  };

  try{
    if(editingId){
      await sb(`expense_requests?id=eq.${editingId}`, {
        method:'PATCH',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify({...payload, updated_at: new Date().toISOString()})
      });
      showToast('更新しました');
    }else{
      await sb('expense_requests', {
        method:'POST',
        headers:{ 'Prefer':'return=minimal' },
        body: JSON.stringify(payload)
      });
      showToast('保存しました');
    }
    resetForm();
    switchTab('list');
  }catch(e){
    showToast('保存に失敗しました');
    console.error(e);
  }
}

let cachedList = [];

async function loadList(){
  const body = document.getElementById('list-body');
  body.innerHTML = '<tr><td colspan="9" class="loading">読み込み中…</td></tr>';
  try{
    const rows = await sb('expense_requests?select=*&order=submit_date.desc.nullslast,created_at.desc');
    cachedList = rows;
    renderList();
  }catch(e){
    body.innerHTML = '<tr><td colspan="9" class="empty">読み込みに失敗しました</td></tr>';
    console.error(e);
  }
}

function renderList(){
  const body = document.getElementById('list-body');
  const q = (document.getElementById('search-box').value || '').trim().toLowerCase();
  const rows = q
    ? cachedList.filter(r => (r.subject||'').toLowerCase().includes(q) || (r.assignee||'').toLowerCase().includes(q))
    : cachedList;

  if(!rows.length){
    body.innerHTML = '<tr><td colspan="9" class="empty">該当する申請はありません</td></tr>';
    return;
  }
  body.innerHTML = rows.map(r=>`
      <tr>
        <td>${r.submit_date || '—'}</td>
        <td>${r.category || '—'}</td>
        <td class="subject-cell">${escapeHtml(r.subject)}</td>
        <td class="amt">${r.total_cost ? '¥'+Number(r.total_cost).toLocaleString() : '—'}</td>
        <td>${r.assignee || '—'}</td>
        <td>${r.accounting_submit_date || '—'}</td>
        <td>${r.accounting_approve_date || '—'}</td>
        <td>${r.pdf_no || '—'}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn print" onclick="openPrint('${r.id}')">印刷</button>
            <button class="icon-btn edit" onclick="editRequest('${r.id}')">編集</button>
            <button class="icon-btn del" onclick="deleteRequest('${r.id}')">削除</button>
          </div>
        </td>
      </tr>
    `).join('');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function editRequest(id){
  const r = cachedList.find(x=>x.id===id);
  if(!r) return;
  editingId = id;
  document.getElementById('f-category').value = r.category || '';
  document.getElementById('f-department').value = r.department || '';
  document.getElementById('f-assignee').value = r.assignee || '';
  document.getElementById('f-pdf-no').value = r.pdf_no || '';
  document.getElementById('f-submit-date').value = r.submit_date || '';
  document.getElementById('f-start-date').value = r.start_date || '';
  document.getElementById('f-end-date').value = r.end_date || '';
  document.getElementById('f-subject').value = r.subject || '';
  document.getElementById('f-budget').value = r.budget_category || '';
  document.getElementById('f-cost').value = r.total_cost || '';
  document.getElementById('f-estimate').checked = !!r.has_estimate_attached;
  document.getElementById('f-overview').value = r.overview || '';
  document.getElementById('f-remarks').value = r.remarks || '';
  document.getElementById('f-acc-submit').value = r.accounting_submit_date || '';
  document.getElementById('f-acc-approve').value = r.accounting_approve_date || '';
  document.getElementById('f-list-note').value = r.list_note || '';

  document.getElementById('form-mode-title').textContent = `編集中：${r.subject}`;
  document.getElementById('save-btn').textContent = '更新する';
  switchTab('new');
}

async function deleteRequest(id){
  if(!confirm('この申請を削除しますか？')) return;
  try{
    await sb(`expense_requests?id=eq.${id}`, { method:'DELETE' });
    showToast('削除しました');
    loadList();
  }catch(e){
    showToast('削除に失敗しました');
    console.error(e);
  }
}

function toReiwaParts(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  const reiwaStart = new Date('2019-05-01T00:00:00');
  if(d < reiwaStart) return { y:null, m: d.getMonth()+1, dd: d.getDate(), eraLabel: `${d.getFullYear()}年` };
  const y = d.getFullYear() - 2018;
  return { y, m: d.getMonth()+1, dd: d.getDate(), eraLabel: '令和' };
}

function escapeHtml2(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Builds a spaced line like 令和[8]年[8]月[17]日提出 where kanji segments
// get even letter-spacing and the inserted numbers stay tight/unspaced.
function fmtReiwaLine(dateStr, suffixHtml, tight){
  const p = toReiwaParts(dateStr);
  const gap1 = tight ? ' ' : '　　　';
  const gap2 = tight ? ' ' : '　　　　';
  if(!p){
    return `<span class="rl">令和</span>${gap1}<span class="rl">年</span>${gap2}<span class="rl">月</span>${gap2}<span class="rl">日</span><span class="suffix">${suffixHtml}</span>`;
  }
  const yearPart = p.eraLabel === '令和'
    ? `<span class="rl">令和</span> <span class="num">${p.y}</span> <span class="rl">年</span>`
    : `<span class="num">${p.eraLabel}</span>`;
  return `${yearPart}${gap2}<span class="num"> ${p.m} </span><span class="rl">月</span>${gap2}<span class="num"> ${p.dd} </span><span class="rl">日</span><span class="suffix">${suffixHtml}</span>`;
}

function digitCells(amount){
  const n = Math.floor(Number(amount)||0);
  if(!n) return Array(10).fill('');
  const str = String(Math.min(n,9999999999)).padStart(10,'0');
  const firstNonZero = str.split('').findIndex(c=>c!=='0');
  return str.split('').map((c,i)=> i<firstNonZero ? '' : c);
}

function openPrint(id){
  const r = cachedList.find(x=>x.id===id);
  if(!r) return;

  document.getElementById('p-department').textContent = `（${r.department || '　　　　　　　　　　　　　　'}）`;
  document.getElementById('p-submit-date').innerHTML = fmtReiwaLine(r.submit_date, '提出', true);
  document.getElementById('p-start-date').innerHTML = fmtReiwaLine(r.start_date, '　　着 工 予 定');
  document.getElementById('p-end-date').innerHTML = fmtReiwaLine(r.end_date, '　　終 了 予 定');
  document.getElementById('p-subject').textContent = r.subject || '';
  document.getElementById('p-budget').textContent = r.budget_category || '';
  document.getElementById('p-overview').textContent = r.overview || '';
  document.getElementById('p-remarks').textContent = r.remarks || '';

  const cells = digitCells(r.total_cost);
  document.getElementById('p-cost-cells').innerHTML = cells.map(c=>`<div>${c}</div>`).join('');

  document.getElementById('print-overlay').classList.add('show');
  fitSheetToScreen();
}

function fitSheetToScreen(){
  const sheet = document.querySelector('.sheet');
  if(!sheet) return;
  sheet.style.zoom = '';
  const naturalWidth = sheet.offsetWidth;
  const available = window.innerWidth - 32; // matches overlay's 16px side padding
  if(naturalWidth > available){
    const scale = available / naturalWidth;
    sheet.style.zoom = scale;
  }
}

window.addEventListener('resize', () => {
  if(document.getElementById('print-overlay').classList.contains('show')) fitSheetToScreen();
});

function closePrint(){
  document.getElementById('print-overlay').classList.remove('show');
}

document.getElementById('f-submit-date').value = new Date().toISOString().slice(0,10);
loadOptions();

document.getElementById('f-category').addEventListener('change', (e)=>{
  const budgetField = document.getElementById('f-budget');
  if(!budgetField.value || budgetField.value === '本部営繕費' || budgetField.value === '教庁営繕費'){
    budgetField.value = e.target.value === '本部' ? '本部営繕費' : e.target.value === '教庁' ? '教庁営繕費' : '';
  }
});
</script>
